<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <meta name="robots" content="noindex" />
    <title>حضوربان | اتصال اینترنت برقرار نیست</title>
    <link rel="icon" type="image/png" href="/icons/favicon-32.png" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: "Vazirmatn", Tahoma, sans-serif;
        background:
          radial-gradient(circle at 85% 10%, rgba(83, 109, 254, 0.16), transparent 45%),
          radial-gradient(circle at 10% 90%, rgba(57, 77, 216, 0.14), transparent 45%),
          #f5f7fb;
        color: #1d2939;
      }
      .card {
        width: 100%;
        max-width: 420px;
        text-align: center;
        background: rgba(255, 255, 255, 0.86);
        border: 1px solid rgba(29, 41, 57, 0.08);
        border-radius: 24px;
        padding: 36px 28px 30px;
        box-shadow: 0 24px 60px rgba(16, 24, 40, 0.12);
        backdrop-filter: blur(12px);
      }
      .logo {
        width: 74px;
        height: 74px;
        margin: 0 auto 18px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(145deg, #5b74ff, #3446c9);
        box-shadow: 0 14px 30px rgba(67, 97, 238, 0.34);
      }
      .logo svg { width: 40px; height: 40px; fill: #fff; }
      h1 { font-size: 20px; margin: 0 0 10px; font-weight: 800; }
      p { margin: 0 0 22px; font-size: 13px; line-height: 2; color: #667085; }
      button {
        font-family: inherit;
        font-size: 13px;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(145deg, #536dfe, #394dd8);
        border: 0;
        border-radius: 12px;
        padding: 12px 26px;
        cursor: pointer;
        box-shadow: 0 10px 24px rgba(67, 97, 238, 0.3);
        transition: transform 0.18s ease, box-shadow 0.18s ease;
      }
      button:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(67, 97, 238, 0.36); }
      button:active { transform: scale(0.97); }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        color: #667085;
        margin-top: 18px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #f0a13a;
        box-shadow: 0 0 0 4px rgba(240, 161, 58, 0.16);
      }
      @media (prefers-reduced-motion: reduce) {
        button, button:hover, button:active { transition: none; transform: none; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
          <path d="M8.06 6.5a.5.5 0 0 1 .5.5v.776a11.5 11.5 0 0 1-.552 3.519l-1.331 4.14a.5.5 0 0 1-.952-.305l1.33-4.141a10.5 10.5 0 0 0 .504-3.213V7a.5.5 0 0 1 .5-.5Z"/>
          <path d="M6.06 7a2 2 0 1 1 4 0 .5.5 0 1 1-1 0 1 1 0 1 0-2 0v.332q0 .613-.066 1.221A.5.5 0 0 1 6 8.447q.06-.555.06-1.115zm3.509 1a.5.5 0 0 1 .487.513 11.5 11.5 0 0 1-.587 3.339l-1.266 3.8a.5.5 0 0 1-.949-.317l1.267-3.8a10.5 10.5 0 0 0 .535-3.048A.5.5 0 0 1 9.569 8m-3.356 2.115a.5.5 0 0 1 .33.626L5.24 14.939a.5.5 0 1 1-.955-.296l1.303-4.199a.5.5 0 0 1 .625-.329"/>
          <path d="M4.759 5.833A3.501 3.501 0 0 1 11.559 7a.5.5 0 0 1-1 0 2.5 2.5 0 0 0-4.857-.833.5.5 0 1 1-.943-.334m.3 1.67a.5.5 0 0 1 .449.546 10.7 10.7 0 0 1-.4 2.031l-1.222 4.072a.5.5 0 1 1-.958-.287L4.15 9.793a9.7 9.7 0 0 0 .363-1.842.5.5 0 0 1 .546-.449Zm6 .647a.5.5 0 0 1 .5.5c0 1.28-.213 2.552-.632 3.762l-1.09 3.145a.5.5 0 0 1-.944-.327l1.089-3.145c.382-1.105.578-2.266.578-3.435a.5.5 0 0 1 .5-.5Z"/>
        </svg>
      </div>
      <h1>اتصال اینترنت برقرار نیست</h1>
      <p>
        صفحه‌هایی که قبلاً باز کرده‌اید همچنان در دسترس هستند. برای دریافت اطلاعات
        تازه، اتصال خود را بررسی کنید و دوباره تلاش کنید.
      </p>
      <button type="button" onclick="window.location.reload()">تلاش دوباره</button>
      <div class="status"><span class="dot"></span> حالت آفلاین حضوربان</div>
    </main>
  </body>
</html>
