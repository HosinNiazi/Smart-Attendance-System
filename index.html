    />

    />

    <script>
      // هم‌خوان‌سازی تم قبل از اولین رسم (بدون فلش تم)
      try {
        document.documentElement.dataset.theme =
          JSON.parse(localStorage.getItem('smart-attendance:theme')) === 'dark'
            ? 'dark'
            : 'light';
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <link rel="preload" href="/fonts/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: "Vazirmatn";
        font-style: normal;
        font-weight: 300 800;
        font-display: swap;
        src: url("/fonts/Vazirmatn-Variable.woff2") format("woff2");
      }
    </style>
    <style>
      /* ============ Hozorban splash screen (paints before any JS/CSS) ============ */
      #splash {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; align-items: center; justify-content: center;
        background: #f5f7fb;
        transition: opacity .55s ease, visibility .55s ease;
        overflow: hidden;
      }
      :root[data-theme="dark"] #splash { background: #0f1726; }
      #splash::before, #splash::after {
        content: ""; position: absolute; border-radius: 50%;
        filter: blur(90px); pointer-events: none;
      }
      #splash::before {
        width: 480px; height: 480px; top: -160px; right: -160px;
        background: radial-gradient(circle, rgba(83,109,254,.22), transparent 70%);
      }
      #splash::after {
        width: 520px; height: 520px; bottom: -180px; left: -180px;
        background: radial-gradient(circle, rgba(57,77,216,.18), transparent 70%);
      }
      :root[data-theme="dark"] #splash::before { background: radial-gradient(circle, rgba(83,109,254,.30), transparent 70%); }
      :root[data-theme="dark"] #splash::after { background: radial-gradient(circle, rgba(67,97,238,.22), transparent 70%); }
      #splash.splash-hide { opacity: 0; visibility: hidden; pointer-events: none; }

      .splash-inner {
        position: relative; display: flex; flex-direction: column;
        align-items: center; gap: 12px; text-align: center;
        font-family: 'Vazirmatn', Tahoma, sans-serif;
      }
      .splash-logo-wrap { position: relative; width: 128px; height: 128px; display: flex; align-items: center; justify-content: center; }
      .splash-halo {
        position: absolute; inset: -6px; border-radius: 36px;
        background: radial-gradient(circle, rgba(83,109,254,.55) 0%, rgba(83,109,254,.18) 45%, transparent 72%);
        filter: blur(10px);
        animation: splash-halo 2.6s ease-in-out infinite;
      }
      @keyframes splash-halo {
        0%, 100% { transform: scale(.82); opacity: .55; }
        50%      { transform: scale(1.28); opacity: 1; }
      }
      .splash-ring {
        position: absolute; inset: 2px; border-radius: 34px;
        border: 2px solid rgba(101,124,255,.6);
        animation: splash-ring 2.6s ease-out infinite;
      }
      @keyframes splash-ring {
        0%   { transform: scale(.78); opacity: 0; }
        30%  { opacity: .95; }
        100% { transform: scale(1.42); opacity: 0; }
      }
      .splash-logo {
        position: relative; width: 92px; height: 92px; border-radius: 24px;
        background: linear-gradient(145deg, #536dfe, #394dd8);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 16px 38px rgba(67,97,238,.38), inset 0 1px 0 rgba(255,255,255,.4);
        animation: splash-breathe 2.6s ease-in-out infinite;
      }
      @keyframes splash-breathe {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.06); }
      }
      .splash-logo svg { width: 48px; height: 48px; fill: #fff; }

      .splash-name {
        margin: 4px 0 0; font-size: 32px; font-weight: 800; letter-spacing: .2px;
        color: #1d2939;
      }
      :root[data-theme="dark"] .splash-name { color: #e6ebf4; }
      .splash-latin {
        font-size: 11px; font-weight: 600; letter-spacing: .5em;
        color: #8490a4; padding-inline-start: .5em; margin-top: -6px;
      }
      .splash-latin b { color: #4361ee; font-weight: 800; }
      :root[data-theme="dark"] .splash-latin b { color: #8fa3ff; }
      .splash-tagline { margin: 0; font-size: 11.5px; color: #8490a4; }

      .splash-dots { display: flex; gap: 7px; margin-top: 10px; }
      .splash-dots span {
        width: 7px; height: 7px; border-radius: 50%; background: #4361ee;
        animation: splash-dot 1.25s infinite ease-in-out;
      }
      .splash-dots span:nth-child(2) { animation-delay: .18s; }
      .splash-dots span:nth-child(3) { animation-delay: .36s; }
      @keyframes splash-dot {
        0%, 80%, 100% { transform: scale(.45); opacity: .3; }
        40%           { transform: scale(1.2);  opacity: 1; }
      }
      .splash-noscript { color: #d64545; font-size: 12px; margin-top: 14px; }
      @media (prefers-reduced-motion: reduce) {
        .splash-halo, .splash-ring, .splash-logo, .splash-dots span { animation: none !important; }
      }
    </style>
  </head>
  <body>

              <path d="M4.81 1.37A6.5 6.5 0 0 1 14.56 7a.5.5 0 1 1-1 0 5.5 5.5 0 0 0-8.25-4.765.5.5 0 0 1-.5-.865m-.89 1.257a.5.5 0 0 1 .04.706A5.48 5.48 0 0 0 2.56 7a.5.5 0 0 1-1 0c0-1.664.626-3.184 1.655-4.333a.5.5 0 0 1 .706-.04ZM1.915 8.02a.5.5 0 0 1 .346.616l-.779 2.767a.5.5 0 1 1-.962-.27l.778-2.767a.5.5 0 0 1 .617-.346m12.15.481a.5.5 0 0 1 .49.51c-.03 1.499-.161 3.025-.727 4.533l-.07.187a.5.5 0 0 1-.936-.351l.07-.187c.506-1.35.634-2.74.663-4.202a.5.5 0 0 1 .51-.49"/>
            </svg>
          </div>
        </div>
        <h1 class="splash-name">حضوربان</h1>
        <div class="splash-latin">H O Z O <b>R</b> B A N</div>
        <p class="splash-tagline">سامانه هوشمند حضور و غیاب</p>
        <div class="splash-dots" aria-hidden="true"><span></span><span></span><span></span></div>
        <noscript><p class="splash-noscript">برای اجرای سامانه، JavaScript را در مرورگر فعال کنید.</p></noscript>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
